# Render Blueprint: web app / shared API + PostgreSQL.
# Render dashboard → New → Blueprint → select this repository. See deploy/RENDER.ar.md.
services:
  - type: web
    name: compound-vms
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: compound-vms-db
          property: connectionString
      # Render appends the real client address as the last X-Forwarded-For entry.
      - key: TRUST_PROXY
        value: "false"
      - key: PASS_TOKEN_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # One-time web setup of the first administrator at /setup.
      - key: SETUP_TOKEN
        generateValue: true
      - key: SMS_PROVIDER
        value: disabled
      - key: PUSH_PROVIDER
        value: none
      - key: DATABASE_POOL_MAX
        value: "5"

databases:
  - name: compound-vms-db
    plan: free
    region: frankfurt
    databaseName: vms
    user: vms
