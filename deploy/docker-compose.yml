# Production stack for a single server (VPS):
#   PostgreSQL 16  +  web app / shared API  +  Caddy (automatic HTTPS)  +  daily database backups
#
#   cd deploy && cp .env.example .env   # fill in the values
#   docker compose up -d --build
#
# See deploy/README.ar.md for the full step-by-step guide.

name: compound-vms

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: vms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published on the host: only the web container can reach the database.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: compound-vms-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://vms:${POSTGRES_PASSWORD}@postgres:5432/vms
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      # Caddy replaces X-Forwarded-For with the real client address.
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Daily compressed dump; old dumps are removed after BACKUP_KEEP_DAYS days.
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h postgres -U vms -d vms -Fc -f /backups/vms-$$ts.dump && echo "backup ok: vms-$$ts.dump" || echo "backup FAILED"
          find /backups -name 'vms-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
